services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitutor
      POSTGRES_USER: aitutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitutor -d aitutor"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aitutor:${POSTGRES_PASSWORD:-change-me}@postgres:5432/aitutor
      DEV_MODE: "${DEV_MODE:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/init_database.py && uvicorn web_app:app --host 0.0.0.0 --port 5000 --workers ${WEB_CONCURRENCY:-2}"]
    ports:
      - "5000:5000"

volumes:
  postgres_data:
