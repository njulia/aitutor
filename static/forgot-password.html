<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot password | Homework Magic</title>
  <meta name="description" content="Request a secure password reset link for Homework Magic.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body class="hm-auth">
<header class="auth-header"><a href="/">✨ Homework Magic</a></header>
<main class="auth-shell">
  <section class="auth-card" aria-labelledby="forgot-title">
    <h1 id="forgot-title">Reset your password</h1>
    <p class="intro">Enter the parent or guardian email used for the account. We will send a one-time link if an account matches.</p>
    <div id="forgot-notice" class="notice" role="status" aria-live="polite"></div>
    <form id="forgot-form">
      <div class="form-row">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      </div>
      <button id="forgot-button" class="primary-button" type="submit">Send reset link</button>
    </form>
    <p class="auth-links"><a href="/login">Back to login</a></p>
    <p class="privacy-note">For privacy, the same message is shown whether or not an account exists.</p>
  </section>
</main>
<script src="/static/js/forgot-password.js" defer></script>
</body>
</html>
