<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Homework Magic</title>
    <meta name="description" content="Create your account to unlock custom homework generation">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .page-title {
            text-align: center;
            color: #444;
            margin-bottom: 30px;
            font-size: 1.3em;
        }

        .plan-badge {
            text-align: center;
            margin-bottom: 24px;
        }

        .plan-badge span {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
            color: #999;
            font-size: 0.9em;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.95em;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9em;
            display: none;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9em;
            display: none;
        }

        .pricing-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.9em;
        }

        .pricing-link a {
            color: #667eea;
            text-decoration: none;
        }

        .pricing-link a:hover {
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body class="hm-register">
    <div class="register-container">
        <div class="logo">✨ Homework Magic</div>
        <h1 class="page-title">Create your family account</h1>

        <div class="plan-badge" id="plan-badge" style="display: none;">
            <span id="plan-name"></span>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 10 characters" minlength="10" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" minlength="10" autocomplete="new-password" required>
            </div>

            <div class="form-group guardian-confirmation">
                <label style="display:flex; gap:10px; align-items:flex-start; font-weight:500;">
                    <input type="checkbox" id="guardian-confirmed" style="width:auto; margin-top:4px;" required>
                    <span>I am a parent or guardian creating this family account. I will use learner nicknames and will not enter a child’s school email address.</span>
                </label>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">Create Account</button>
        </form>

        <div class="divider">or</div>

        <p class="login-link">Already have an account? <a href="/login">Sign in</a></p>

        <p class="pricing-link">
            <a href="#" onclick="window.open('/pricing', '_blank', 'width=800,height=600'); return false;">View pricing plans</a>
        </p>
    </div>

    <script>
        // 从 URL 参数读取选中的套餐
        (function() {
            const params = new URLSearchParams(window.location.search);
            const plan = params.get('plan');
            if (plan) {
                const planNames = {
                    '5-day': '5-Day Pass',
                    '1-month': '1-Month Plan',
                    '30-day': '1-Month Plan', // Backward-compatible old link.
                };
                const badge = document.getElementById('plan-badge');
                const nameEl = document.getElementById('plan-name');
                nameEl.textContent = 'Selected: ' + (planNames[plan] || plan);
                badge.style.display = 'block';
            }
        })();

        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        async function handleRegister(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const guardianConfirmed = document.getElementById('guardian-confirmed').checked;
            const submitBtn = document.getElementById('submit-btn');

            // 前端校验
            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            if (password.length < 10) {
                showError('Password must be at least 10 characters.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const params = new URLSearchParams(window.location.search);
                const plan = params.get('plan') || '';

                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        plan: plan,
                        guardian_confirmed: guardianConfirmed,
                    }),
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Account created successfully! Redirecting...');
                    localStorage.setItem('auth_state', 'logged_in');
                    localStorage.removeItem('student_id');
                    localStorage.removeItem('student_email');
                    const requestedNext = params.get('next') || sessionStorage.getItem('postLoginPath') || '/app';
                    const next = requestedNext.startsWith('/') && !requestedNext.startsWith('//') ? requestedNext : '/app';
                    sessionStorage.removeItem('postLoginPath');
                    setTimeout(() => {
                        window.location.href = next;
                    }, 800);
                } else {
                    showError(data.error || 'Registration failed. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            } catch (err) {
                showError('Network error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        }
    </script>
</body>
</html>
