<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a new password | Homework Magic</title>
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<header class="auth-header"><a href="/">✨ Homework Magic</a></header>
<main class="auth-shell">
  <section class="auth-card" aria-labelledby="reset-title">
    <h1 id="reset-title">Choose a new password</h1>
    <p class="intro">Use at least 8 characters. A longer phrase is easier to remember and harder to guess.</p>
    <div id="reset-notice" class="notice" role="status" aria-live="polite"></div>
    <form id="reset-form" hidden>
      <div class="form-row">
        <label for="password">New password</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <button class="show-password" type="button" data-target="password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="form-row">
        <label for="confirm-password">Confirm new password</label>
        <div class="password-wrap">
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <button class="show-password" type="button" data-target="confirm-password" aria-pressed="false">Show</button>
        </div>
      </div>
      <button id="reset-button" class="primary-button" type="submit">Change password</button>
    </form>
    <p class="auth-links"><a href="/forgot-password">Request another link</a></p>
  </section>
</main>
<script src="/static/js/reset-password.js" defer></script>
</body>
</html>
