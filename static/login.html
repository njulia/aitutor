<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in | Homework Magic</title>
  <meta name="description" content="Log in to a Homework Magic parent or guardian account.">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<header class="auth-header"><a href="/">✨ Homework Magic</a></header>
<main class="auth-shell">
  <section class="auth-card" aria-labelledby="login-title">
    <h1 id="login-title">Welcome back</h1>
    <p class="intro">Log in to your parent or guardian account.</p>
    <div id="login-notice" class="notice" role="status" aria-live="polite"></div>
    <form id="login-form">
      <div class="form-row">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <button class="show-password" type="button" data-target="password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="form-help"><a href="/forgot-password">Forgot your password?</a></div>
      <button id="login-button" class="primary-button" type="submit">Log in</button>
    </form>
    <p class="auth-links">New here? <a href="/register">Create an account</a></p>
    <p class="privacy-note">Account details should be entered by a parent or guardian. Do not use a child’s school email address.</p>
  </section>
</main>
<script src="/static/js/login.js" defer></script>
</body>
</html>
