[pytest]
addopts = -ra --strict-markers
pythonpath = .
testpaths = test
markers =
    unit: fast tests for isolated functions and stores
    api: FastAPI endpoint tests with isolated local databases
    e2e: browser tests against a running website
    integration: tests that use an installed RAG or external-compatible component
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
